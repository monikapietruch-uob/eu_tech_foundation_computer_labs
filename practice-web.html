<!DOCTYPE html>
<!--
  practice-web.html — weeks 6 to 8: how the web works. Built like the hub's
  Python pages (index.html): js/web-shell.js draws either the task list or
  one task into <main id="app">, and js/web-tasks.js fills the task area
  according to the task type:
    html-editor  — HTML + CSS boxes with a live preview and a checklist
    inspect      — a flawed sample page beside a checklist, with Reveal
    walkthrough  — the request/response step-through, matching, writing
    summary      — a text, a note-taking frame, a 30-word summary box
  Styles: css/hub.css (shared with index.html) plus css/web.css.
  Progress and reflections are saved in this browser by js/progress.js.
  Header, nav and footer come from js/layout.js.
-->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Web practice - Tech Practice Hub</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hub.css?v=1">
  <link rel="stylesheet" href="css/web.css?v=2">
</head>
<body>

  <div data-layout="header"></div>
  <div data-layout="nav"></div>

  <main id="app">
    <section class="pagehead"><div class="wrap"><h1>Web practice</h1><p>Loading the tasks…</p></div></section>
  </main>

  <div data-layout="footer"></div>

  <script src="js/layout.js?v=7"></script>
  <script src="js/tasks.js?v=6"></script>
  <script src="js/progress.js?v=5"></script>
  <script src="js/web-shell.js?v=3"></script>
  <script src="js/web-tasks.js?v=8"></script>
</body>
</html>
