<!DOCTYPE html>
<!--
  teachers.html — for the teacher, not linked from the nav. Lists every
  task in tasks/index.json with its week, type, concepts, brief, tests or
  worlds, hints and solution, so a session can be prepared quickly. Built
  by js/teachers.js from the same JSON files the students use. Prints
  cleanly (File > Print) — one week per page.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For teachers — Tech Practice Hub</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css?v=6" />
  <style>
    /* Page-only styles: a reading layout with solutions in code blocks. */
    .teach { max-width: 1008px; }
    .teach-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 28px 0 8px; }
    .teach-week { margin: 32px 0; break-before: page; }
    .teach-week:first-of-type { break-before: auto; }
    .teach-week h2 { font-size: 40px; border-top: 4px solid var(--black); padding-top: 12px; margin-bottom: 12px; }
    .teach-task { border: 2px solid var(--line); padding: 16px 20px; margin: 12px 0; break-inside: avoid; }
    .teach-task h3 { font-size: 26px; margin-bottom: 4px; }
    .teach-meta { font-size: 13px; color: var(--grey); font-weight: 400; margin-bottom: 8px; }
    .teach-meta code { font-size: 12px; }
    .teach-task h4 { font-size: 20px; color: var(--grey); margin: 14px 0 6px; }
    .teach-task pre { font: 13px/1.5 var(--mono); background: var(--paper); border: 1px solid var(--line); padding: 10px 12px; white-space: pre-wrap; margin: 0; }
    .teach-task pre.sol { background: var(--black); color: #eee; border-color: var(--black); }
    .teach-task ol, .teach-task ul { padding-left: 20px; font-size: 14px; font-weight: 400; }
    .teach-task .brief p { font-size: 14px; font-weight: 400; margin-bottom: 6px; }
    .teach-task .decoy { color: var(--maroon); }
    .teach-link { font-size: 13px; color: var(--red); }
    @media print {
      nav, footer, header, .skip-link, .teach-controls { display: none !important; }
      .pagehead { background: none; color: var(--ink); }
      .teach-task { border: 1px solid #ccc; }
      details { display: block; }
    }
  </style>
</head>
<body>

  <div data-layout="header"></div>
  <div data-layout="nav"></div>

  <main>
    <section class="pagehead"><div class="container">
      <p class="eyebrow">Tech Practice Hub &middot; For teachers</p>
      <h1>For teachers</h1>
      <p class="page-intro">Every task on the site, with its brief, checks, hints and solution. This page is not linked from the menu. Print it for a session (one week per page).</p>
    </div></section>
    <div class="container page-body teach">
    <div class="teach-controls">
      <button type="button" class="btn outline" id="expandAll">Show all solutions</button>
      <button type="button" class="btn outline" id="collapseAll">Hide all solutions</button>
      <a class="btn" href="javascript:window.print()">Print</a>
      <span class="muted small" id="teachCount"></span>
    </div>
    <div id="teachList"><p class="muted">Loading tasks…</p></div>
    </div>
  </main>

  <div data-layout="footer"></div>

  <script src="js/layout.js?v=7"></script>
  <script src="js/tasks.js?v=5"></script>
  <script src="js/teachers.js?v=5"></script>
</body>
</html>
