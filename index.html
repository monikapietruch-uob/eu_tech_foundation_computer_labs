<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Tech Practice Hub - EU Foundation, University of Bedfordshire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --red: #D0112B;
  --maroon: #8A0A2E;
  --black: #000000;
  --white: #FFFFFF;
  --ink: #1B1B1B;
  --grey: #5C5C5C;
  --line: #D6D6D6;
  --paper: #F4F4F4;
  --green: #0E7A3E;
  --uob-green: #78BE20; /* UoB secondary green - replace with the hex from the brand guide if it differs */
  --display: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body: "Univers", "Univers LT Std", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: var(--white); }
body { font-family: var(--body); color: var(--ink); font-weight: 700; line-height: 1.45; font-size: 16px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; line-height: 0.95; margin: 0; }
a { color: inherit; }
button { font: inherit; cursor: pointer; }
code, pre { font-family: var(--mono); font-weight: 400; }
p code, li code, .brief code { background: var(--paper); padding: 0 .3em; border: 1px solid var(--line); font-size: .92em; }
:focus-visible { outline: 3px solid var(--black); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* ---------- top bars ---------- */
.topbar { background: var(--black); color: var(--white); }
.topbar .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 84px; gap: 16px; }
.logo { display: flex; align-items: center; gap: 18px; text-decoration: none; color: var(--white); }
.logo img { height: 50px; width: auto; display: block; }
.logo .unit { display: flex; flex-direction: column; justify-content: center; height: 34px; margin-top: 16px; font-size: 11px; letter-spacing: .14em; line-height: 1.55; color: #ddd; border-left: 2px solid #666; padding-left: 18px; }
.accred { font-size: 12px; text-align: right; line-height: 1.5; letter-spacing: .01em; }
.nav { background: var(--red); color: var(--white); }
.nav .wrap { display: flex; gap: 0; overflow-x: auto; }
.nav a { padding: 15px 20px; text-decoration: none; font-size: 15px; white-space: nowrap; }
.nav a[aria-current="page"] { background: var(--maroon); }
.nav a:hover, .nav a:focus-visible { background: var(--uob-green); color: var(--black); }

/* ---------- hero ---------- */
.hero { background: var(--red); color: var(--white); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -8vw; top: -32vw; width: 60vw; height: 70vw; max-width: 760px; max-height: 880px; min-width: 420px; min-height: 500px; border-radius: 50%; background: var(--maroon); pointer-events: none; }
.hero .wrap { position: relative; z-index: 1; padding-top: 44px; padding-bottom: 42px; }
.eyebrow { font-size: 13px; letter-spacing: .16em; margin: 0 0 84px; }
.hero h1 { font-size: clamp(72px, 12vw, 150px); }
.hero .lede { max-width: 34ch; font-size: clamp(18px, 2.3vw, 24px); margin: 12px 0 96px; line-height: 1.3; }
.hero-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.chips { display: flex; gap: 14px; flex-wrap: wrap; }
.chip { font-family: var(--display); text-transform: uppercase; font-size: 24px; letter-spacing: .02em; padding: 8px 22px; border: 2px solid var(--white); color: var(--white); background: transparent; text-decoration: none; line-height: 1.2; }
.chip.on { background: var(--white); color: var(--red); }
.hero-note { font-size: 13px; text-align: right; line-height: 1.5; }
@media (max-width: 1100px) { .hero::after { width: 52vw; height: 56vw; min-width: 360px; min-height: 380px; top: -30vw; right: -10vw; } }
@media (max-width: 720px) { .eyebrow { margin-bottom: 40px; } .hero .lede { margin-bottom: 48px; } .hero-note { text-align: left; } .hero::after { width: 60vw; height: 60vw; min-width: 240px; min-height: 240px; max-height: 300px; top: -34vw; right: -16vw; } }

/* ---------- sections ---------- */
section.block { padding: 48px 0 8px; }
section.block h2 { font-size: 46px; }
section.block > .wrap > p.intro { color: var(--grey); margin: 6px 0 22px; max-width: 80ch; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 960px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
.card { padding: 24px 22px 22px; min-height: 460px; display: flex; flex-direction: column; color: var(--white); text-decoration: none; }
.card.maroon { background: var(--maroon); } .card.red { background: var(--red); } .card.black { background: var(--black); }
.card.outline { background: var(--white); color: var(--ink); border: 3px solid var(--black); }
.card .when { font-size: 11px; letter-spacing: .16em; margin-bottom: 10px; }
.card.outline .when { color: var(--grey); }
.card h3 { font-size: 40px; margin-bottom: 12px; }
.card p { font-size: 15px; line-height: 1.5; margin: 0; }
.card .foot { margin-top: auto; padding-top: 24px; }
.card .count { font-size: 13px; margin-bottom: 10px; }
.card .btn { display: block; text-align: center; padding: 11px; background: var(--white); color: var(--ink); text-decoration: none; }
.card.maroon .btn { color: var(--maroon); } .card.red .btn { color: var(--red); } .card.outline .btn { background: var(--black); color: var(--white); }
.card .btn:hover { filter: brightness(.94); }

.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 800px) { .games { grid-template-columns: 1fr; } }
.game { border: 1px solid var(--line); padding: 20px 20px 18px; }
.game h3 { font-size: 24px; margin-bottom: 6px; }
.game p { margin: 0 0 10px; font-size: 14px; }
.game a { color: var(--red); text-decoration: none; font-size: 14px; }
.game a:hover { text-decoration: underline; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding-bottom: 56px; }
@media (max-width: 800px) { .two { grid-template-columns: 1fr; gap: 32px; } }
.two h2 { font-size: 40px; margin-bottom: 8px; }
.two p { font-size: 14px; margin: 0 0 16px; max-width: 60ch; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.button { padding: 11px 20px; border: 2px solid var(--black); background: var(--white); color: var(--ink); text-decoration: none; display: inline-block; }
.button.primary { background: var(--red); border-color: var(--red); color: var(--white); }
.button.primary:hover { background: #B50E25; border-color: #B50E25; }
.button.black { background: var(--black); color: var(--white); }
.button:disabled { opacity: .5; cursor: default; }
.reslist { list-style: none; padding: 0; margin: 0; }
.reslist li { border-top: 1px solid var(--line); }
.reslist li:last-child { border-bottom: 1px solid var(--line); }
.reslist a { display: flex; justify-content: space-between; padding: 12px 0; text-decoration: none; font-size: 15px; }
.reslist a span:last-child { color: var(--red); }

.footer { background: var(--black); color: var(--white); padding: 40px 0 34px; margin-top: 40px; }
.footer h2 { font-size: 46px; line-height: .95; }
.footer h2 span { display: block; color: var(--red); }
.footer .credit { font-size: 13px; font-weight: 500; color: #cfcfcf; max-width: 70ch; margin: 18px 0 0; line-height: 1.5; }
.pagehead .credit { font-size: 14px; font-weight: 500; opacity: .9; }
.footer .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-top: 22px; font-size: 13px; }
.footer .row a { text-decoration: none; margin-left: 22px; }
.footer .row > div:first-child { line-height: 1.6; }

/* ---------- task list page ---------- */
.pagehead { background: var(--red); color: var(--white); }
.pagehead .wrap { padding: 34px 24px 30px; }
.pagehead h1 { font-size: clamp(48px, 7vw, 84px); }
.pagehead p { max-width: 70ch; margin: 8px 0 0; font-size: 16px; }
.weeknav { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.tasklist { padding: 40px 0 56px; }
.group { margin-bottom: 36px; }
.group-head { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; border-top: 4px solid var(--black); padding-top: 14px; margin-bottom: 16px; }
@media (max-width: 720px) { .group-head { grid-template-columns: 1fr; gap: 6px; } }
.group-head h2 { font-size: 40px; }
.group-head .sub { font-size: 12px; letter-spacing: .12em; color: var(--grey); margin-bottom: 4px; }
.group-head p { margin: 0; font-size: 15px; color: var(--grey); max-width: 70ch; }
.trow { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); text-decoration: none; }
.trow:last-child { border-bottom: 1px solid var(--line); }
.trow .n { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--red); }
.trow.done .n { color: var(--green); }
.trow .t { font-size: 17px; }
.trow .c { font-size: 13px; color: var(--grey); font-weight: 700; }
.trow .s { font-size: 12px; letter-spacing: .1em; padding: 6px 10px; border: 2px solid var(--black); }
.trow.done .s { background: var(--green); color: var(--white); border-color: var(--green); }
.trow:hover .t { text-decoration: underline; }

/* ---------- task page ---------- */
.taskbar { background: var(--red); color: var(--white); }
.taskbar .wrap { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-top: 20px; padding-bottom: 18px; flex-wrap: wrap; }
.taskbar .meta { font-size: 12px; letter-spacing: .14em; margin-bottom: 4px; }
.taskbar h1 { font-size: clamp(40px, 6vw, 64px); }
.taskbar .steps { display: flex; gap: 6px; flex-wrap: wrap; }
.taskbar .steps a { width: 22px; height: 22px; border: 2px solid var(--white); display: block; }
.taskbar .steps a.done { background: var(--white); }
.taskbar .steps a.cur { background: var(--black); border-color: var(--black); }
.task { display: grid; grid-template-columns: minmax(300px, 5fr) minmax(0, 7fr); gap: 36px; padding: 32px 0 48px; }
@media (max-width: 900px) { .task { grid-template-columns: 1fr; gap: 28px; } }
.brief h2 { font-size: 30px; margin-bottom: 10px; }
.brief p { font-size: 15.5px; line-height: 1.6; margin: 0 0 14px; font-weight: 500; }
.brief p b { font-weight: 800; }
.brief .scen { background: var(--paper); border-left: 6px solid var(--black); padding: 12px 14px; font-size: 14px; font-weight: 500; margin: 0 0 18px; }
.cmds { margin: 8px 0 20px; border: 1px solid var(--line); font-size: 13px; }
.cmds > div { display: grid; grid-template-columns: 1fr 1fr; }
.cmds h4 { font-size: 20px; padding: 8px 12px 4px; }
.cmds ul { list-style: none; margin: 0; padding: 0 12px 10px; }
.cmds li { font-weight: 500; padding: 2px 0; }
.cmds li code { background: none; border: 0; padding: 0; font-weight: 600; }
.wordbank h3 { font-size: 26px; margin: 0 0 4px; }
.wordbank details { border-top: 1px solid var(--line); }
.wordbank details:last-child { border-bottom: 1px solid var(--line); }
.wordbank summary { cursor: pointer; padding: 9px 0; font-size: 15px; list-style: none; display: flex; justify-content: space-between; }
.wordbank summary::after { content: "+"; color: var(--red); font-family: var(--display); font-size: 22px; line-height: .8; }
.wordbank details[open] summary::after { content: "–"; }
.wordbank .def { font-weight: 500; font-size: 14px; padding: 0 0 12px; line-height: 1.55; }
.hints { margin-top: 20px; }
.hints h3 { font-size: 26px; margin-bottom: 6px; }
.hints button { display: block; width: 100%; text-align: left; border: 2px solid var(--black); background: var(--white); padding: 9px 12px; margin-bottom: 6px; }
.hints .hint { display: none; border-left: 6px solid var(--red); padding: 8px 12px; margin: 0 0 8px; font-weight: 500; font-size: 14px; background: var(--paper); }
.hints .hint.show { display: block; }
.hints .hint pre { margin: 6px 0 0; font-size: 13px; }

.worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 560px) { .worlds { grid-template-columns: 1fr; } }
.worldbox { border: 3px solid var(--black); }
.worldbox .lab, .editor .lab, .console .lab { text-transform: uppercase; }
.worldbox .lab { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--black); color: var(--white); font-family: var(--display); font-size: 20px; letter-spacing: .04em; }
.worldbox .lab small { font-family: var(--body); font-size: 11px; letter-spacing: .06em; }
.worldbox svg { display: block; width: 100%; height: auto; }
.worldbox.goal .lab { background: var(--maroon); }

.editor { border: 3px solid var(--black); }
.editor .lab { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 10px; background: var(--black); color: var(--white); font-family: var(--display); font-size: 20px; letter-spacing: .04em; flex-wrap: wrap; }
.editor .lab .tools { display: flex; gap: 8px; align-items: center; font-family: var(--body); font-size: 12px; }
.editor .lab button { background: transparent; color: var(--white); border: 1px solid #888; padding: 3px 8px; font-size: 12px; }
.editor .lab button:hover { border-color: var(--white); }
.edwrap { display: grid; grid-template-columns: 44px 1fr; background: var(--white); }
.gutter { background: var(--paper); color: #9a9a9a; font-family: var(--mono); font-size: 14px; line-height: 1.5; padding: 12px 6px 12px 0; text-align: right; user-select: none; overflow: hidden; white-space: pre; }
.gutter .err { color: var(--white); background: var(--red); }
textarea.code { border: 0; margin: 0; resize: vertical; width: 100%; min-height: 380px; padding: 12px 12px; font-family: var(--mono); font-size: 14px; line-height: 1.5; tab-size: 4; white-space: pre; overflow: auto; color: var(--ink); background: var(--white); font-weight: 400; }
textarea.code:focus { outline: none; box-shadow: inset 0 0 0 3px var(--red); }
/* locked lines: the import/docstring header and the if __name__ footer can't be edited */
.edbody { position: relative; display: grid; }  /* textarea stretches to the gutter's height, as before */
.edbody textarea.code { position: relative; background: transparent; z-index: 1; display: block; }
.lockbg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: var(--white); }
.lockbg .band { position: absolute; left: 0; right: 0; background: #ECECE8; background-image: repeating-linear-gradient(135deg, transparent 0 9px, rgba(0,0,0,.035) 9px 10px); border-left: 4px solid #c9c9c4; }
.gutter .ln { display: block; }
.gutter .lock { background: #E6E6E2; color: #7a7a7a; }
.editor.shake .lockbg .band { border-left-color: var(--red); background-color: #f6dfe2; }
.editor .lab .locknote { color: #ffd6dc; font-size: 12px; font-family: var(--body); }
.editor .lab .locknote[hidden] { display: none; }
.runrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
/* worlds + Run buttons stay on screen while a long program is scrolled */
.stage { position: sticky; top: 0; z-index: 5; background: var(--white); padding-top: 10px; margin-top: -10px; }
.stage .worlds { margin-bottom: 10px; }
.stage.no-world .runrow { border-bottom: 3px solid var(--black); padding-bottom: 12px; }
@media (max-height: 640px) { .stage { position: static; } }
.runrow .speed { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-left: auto; }
.runrow input[type=range] { width: 120px; accent-color: var(--red); }
.inputs { margin: 0 0 14px; }
.inputs label { display: block; font-size: 13px; margin-bottom: 4px; }
.inputs textarea { width: 100%; border: 2px solid var(--black); font-family: var(--mono); font-size: 14px; padding: 8px; min-height: 60px; resize: vertical; }
.console { border: 3px solid var(--black); background: var(--black); color: #eee; font-family: var(--mono); font-size: 14px; line-height: 1.5; padding: 12px 14px; min-height: 120px; white-space: pre-wrap; word-break: break-word; }
.console .lab { font-family: var(--display); font-size: 18px; color: #bbb; letter-spacing: .06em; margin-bottom: 6px; }
.console .in { color: #FFD166; }
.console .errline { color: #FF6B7A; }
.result { margin-top: 14px; padding: 14px 16px; border: 3px solid var(--black); font-size: 15px; display: none; }
.result.ok { display: block; border-color: var(--green); background: #E9F5EE; }
.result.bad { display: block; border-color: var(--red); background: #FBEAEC; }
.result.warn { display: block; border-color: #B8860B; background: #FBF5E1; }
.result h3 { font-size: 26px; margin-bottom: 4px; }
.result p { margin: 0; font-weight: 500; }
.result pre { background: var(--white); border: 1px solid var(--line); padding: 8px; margin: 8px 0 0; font-size: 13px; overflow-x: auto; }
.quick { margin-top: 28px; border-top: 4px solid var(--black); padding-top: 16px; }
.quick h3 { font-size: 30px; margin-bottom: 2px; }
.quick > p { font-weight: 500; margin: 0 0 14px; font-size: 14px; color: var(--grey); }
.qitem { border: 2px solid var(--black); padding: 14px 16px; margin-bottom: 12px; }
.qitem .q { font-weight: 700; margin: 0 0 10px; font-size: 15px; }
.qitem label { display: block; font-weight: 500; padding: 4px 0; font-size: 15px; cursor: pointer; }
.qitem input[type=text] { font: inherit; font-weight: 500; border: 2px solid var(--black); padding: 6px 8px; width: 220px; max-width: 100%; }
.qitem .qrow { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.qitem .fb { font-weight: 500; font-size: 14px; padding: 8px 10px; margin-top: 10px; display: none; border-left: 6px solid var(--red); background: var(--paper); }
.qitem .fb.ok { border-left-color: var(--green); display: block; } .qitem .fb.bad { display: block; }
.reflect { margin-top: 28px; border-top: 4px solid var(--black); padding-top: 16px; }
.reflect h3 { font-size: 30px; margin-bottom: 4px; }
.reflect p { font-weight: 500; margin: 0 0 10px; font-size: 15px; }
.reflect textarea { width: 100%; min-height: 110px; border: 2px solid var(--black); padding: 10px; font: inherit; font-weight: 500; font-size: 15px; resize: vertical; }
.reflect .saved { font-size: 12px; color: var(--grey); margin-top: 6px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
.pager a { text-decoration: none; }

.notice { padding: 56px 0 80px; }
.notice h1 { font-size: 64px; margin-bottom: 12px; }
.notice p { max-width: 60ch; font-weight: 500; }
.visually-hidden { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>
<script>
/* MiniPy - a small Python subset interpreter for teaching tasks.
   Supports: def/return, if/elif/else, while, for..in range(), assignment (+= -= *=),
   int/float/str/bool, + - * / // % comparisons and/or/not, print/input/int/str/float/len,
   `import`/`from .. import ..` (ignored), `if __name__ == '__main__':`.
   Execution is a generator so the page can animate robot steps.            */
var MiniPy = (function () {
  'use strict';

  function PyError(kind, msg, line) { this.kind = kind; this.msg = msg; this.line = line; }
  PyError.prototype.toString = function () { return this.kind + (this.line ? ' (line ' + this.line + ')' : '') + ': ' + this.msg; };

  function PyFloat(v) { this.v = v; }

  var KEYWORDS = { 'def': 1, 'if': 1, 'elif': 1, 'else': 1, 'while': 1, 'for': 1, 'in': 1, 'return': 1, 'pass': 1, 'and': 1, 'or': 1, 'not': 1, 'True': 1, 'False': 1, 'None': 1, 'import': 1, 'from': 1, 'break': 1, 'continue': 1 };

  /* ---------------- tokenizer ---------------- */
  function tokenize(src) {
    var lines = src.replace(/\r\n?/g, '\n').split('\n');
    var toks = [], indents = [0], depth = 0, i, ln;
    var inTriple = null; // {q, line}
    for (i = 0; i < lines.length; i++) {
      ln = i + 1;
      var line = lines[i];
      var pos = 0;
      if (inTriple) {
        var endIdx = line.indexOf(inTriple);
        if (endIdx < 0) continue;
        pos = endIdx + 3; inTriple = null;
        // rest of line is treated as continuation of a statement-level string; ignore remainder tokens rarely matter
        if (line.slice(pos).trim() === '') { if (depth === 0) toks.push({ t: 'NEWLINE', line: ln }); continue; }
      } else {
        // indentation
        var m = /^[ \t]*/.exec(line)[0];
        var stripped = line.slice(m.length);
        if (stripped === '' || stripped[0] === '#' || /^(import|from)\s/.test(stripped)) continue; // blank/comment/import line
        if (depth === 0) {
          var col = 0;
          for (var k = 0; k < m.length; k++) col += (m[k] === '\t') ? 4 - (col % 4) : 1;
          if (col > indents[indents.length - 1]) { indents.push(col); toks.push({ t: 'INDENT', line: ln }); }
          else {
            while (col < indents[indents.length - 1]) { indents.pop(); toks.push({ t: 'DEDENT', line: ln }); }
            if (col !== indents[indents.length - 1]) throw new PyError('IndentationError', 'this line is indented by a different amount from the lines above it. Use 4 spaces for each level of indentation.', ln);
          }
        }
        pos = m.length;
      }
      while (pos < line.length) {
        var c = line[pos];
        if (c === ' ' || c === '\t') { pos++; continue; }
        if (c === '#') break;

  var CELL = 52;
  function renderWorld(w, theme, opts) {
    opts = opts || {};
    var pad = 10, W = w.cols * CELL + pad * 2, H = w.rows * CELL + pad * 2;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (opts.label || 'world') + '">';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="' + theme.bg + '"/>';
    function cx(x) { return pad + (x - 1) * CELL + CELL / 2; }
    function cy(y) { return pad + (w.rows - y) * CELL + CELL / 2; }
    // grid crosses
    for (var x = 1; x <= w.cols; x++) for (var y = 1; y <= w.rows; y++) {
      s += '<path d="M' + (cx(x) - 5) + ' ' + cy(y) + 'h10M' + cx(x) + ' ' + (cy(y) - 5) + 'v10" stroke="' + theme.grid + '" stroke-width="2"/>';
    }
    // robot (drawn first so items on its square stay visible)
    if (!opts.hideRobot) {
      var rot = { E: 0, S: 90, W: 180, N: 270 }[w.dir];
      s += '<g transform="translate(' + cx(w.x) + ' ' + cy(w.y) + ') rotate(' + rot + ')">' + robotShape(theme, w.crashed) + '</g>';
    }
    // items
    for (var k in w.items) {
      var p = k.split(','), ix = cx(+p[0]), iy = cy(+p[1]), n = w.items[k];
      s += '<g opacity="0.92">' + itemShape(theme, ix, iy) + '</g>';
      if (n > 1) s += '<text x="' + (ix + 14) + '" y="' + (iy - 12) + '" font-family="Bebas Neue, Arial Narrow, sans-serif" font-size="18" fill="#000">' + n + '</text>';
    }
    // walls
    var drawn = {};
    for (var wk in w.walls) {

    var n = 0; for (var k = 0; k < TASKS.length; k++) { if (TASKS[k].id === t.id) break; if (groupOf(TASKS[k]) === groupOf(t)) n++; }
    var pick = [items[(n * 2) % items.length], items[(n * 2 + 1) % items.length]];
    var html = '<div class="quick"><h3>Quick practice</h3><p>Two questions on the vocabulary of this section. They are not saved.</p>';
    pick.forEach(function (q, j) {
      html += '<div class="qitem" data-q="' + j + '"><p class="q">' + q.q + '</p>';
      if (q.type === 'mc') html += q.options.map(function (o, oi) { return '<label><input type="radio" name="q' + j + '" value="' + oi + '"> ' + o + '</label>'; }).join('');
      else html += '<input type="text" aria-label="Your answer" autocomplete="off" placeholder="type one word">';
      html += '<div class="qrow"><button type="button" class="button black qcheck">Check</button></div><div class="fb"></div></div>';
    });
    return html + '</div>';
  }
  function wireQuickPractice() {
    var t = TASKS[taskIndex(location.hash.split('/')[2] || '')]; if (!t) return;
    var items = QUIZ[groupOf(t)]; if (!items) return;
    var n = 0; for (var k = 0; k < TASKS.length; k++) { if (TASKS[k].id === t.id) break; if (groupOf(TASKS[k]) === groupOf(t)) n++; }
    Array.prototype.forEach.call(document.querySelectorAll('.qitem'), function (box, j) {
      var q = items[(n * 2 + j) % items.length], fb = box.querySelector('.fb');
      box.querySelector('.qcheck').onclick = function () {
        var ok = false, given;
        if (q.type === 'mc') { var sel = box.querySelector('input:checked'); if (!sel) { fb.className = 'fb bad'; fb.textContent = 'Choose an answer first.'; return; } ok = +sel.value === q.answer; }
        else { given = box.querySelector('input[type=text]').value.trim().toLowerCase().replace(/[^a-z0-9 _-]/g, ''); ok = q.accept.some(function (x) { return x === given; }); if (!given) { fb.className = 'fb bad'; fb.textContent = 'Type an answer first.'; return; } }
        fb.className = 'fb ' + (ok ? 'ok' : 'bad');
        fb.innerHTML = (ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + q.why;
      };
    });
  }

  /* ---------- router ---------- */
  function route() {
    runToken++;
    var h = location.hash.replace(/^#\/?/, '');
    window.scrollTo(0, 0);
    if (h === '' || h === 'extra') { homePage(); if (h === 'extra') { var el = document.getElementById('extra'); if (el) el.scrollIntoView(); } return; }
    if (h === 'python') return listPage();
    if (h.indexOf('python/') === 0) return taskPage(h.slice(7));
    if (h === 'web') { location.replace('practice-web.html'); return; }
    if (h === 'ai') return noticePage('ai', 'Working with AI', 'This block opens in week 9. You will write a Python program that asks an AI a question with call_gpt() and prints the answer - and then check whether the answer is true.');
    if (h === 'resources') return noticePage('res', 'Resources', 'The official Python tutorial, MDN web docs and W3Schools are linked at the bottom of the home page. Your code, progress and reflections are stored only in this browser on this computer; nothing is sent to a server.');
    homePage();
  }
  window.addEventListener('hashchange', route);
  route();
})();

</script>
